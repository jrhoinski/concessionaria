<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Concessionária - Sitema de Gestão</title>
</head>
<body>
    <header>
        <h1>Concessionária</h1>
        <nav>
            <button class="nav-btn ativa" onclick="mostrarSecao('marcas')">Marcas</button>
            <button class="nav-btn" onclick="mostrarSecao('veiculos')">Veículos</button>
        </nav>
    </header>
    
    <main>
        <section id="secao-marcas" class="secao ativa">
            <div class="card">
                <h2>Cadastro de Marca</h2>
                <input type="hidden" id="marca-id">
                <div class="form-group">
                    <label for="marca-nome">Nome da Marca</label>
                    <input type="text" id="marca-nome" placeholder="Ex: Toyota">
                </div>
                <div class="form-acoes">
                    <button class="btn btn-primario" onclick="salvarMarca()">Salvar</button>
                    <button class="btn btn-secundario" onclick="limparFormMarca()">Limpar</button>
                </div>                
            </div>

            <div class="card">
                <h2>Marcas Cadastradas</h2>
                <div id="feedback-marcas" class="feedback"></div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-marcas"></tbody>
                </table>
            </div>

        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
