<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concessionária - Sitema de Gestão</title>
</head>
<body>
    <header>
        <h1>Concessionária</h1>
        <nav>
            <button>Marcas</button>
            <button>Veículos</button>
        </nav>
    </header>
    
    <main>
        <section id="secao-marcas" class="secao ativa">
            <div class="card">
                <h2>Cadastro de Marca</h2>
                <input type="hidden" id="marca-id">
                <div class="form-group">
                    <label for="marca-nome">Nome da Marca</label>
                    <input type="text" id="marca-nome" placeholder="Ex: Toyota">
                </div>
                <div class="form-acoes">
                    <button class="btn btn-primario">Salvar</button>
                    <button class="btn btn-secundario">Limpar</button>
                </div>
                
            </div>
        </section>
    </main>

    
</body>
</html>
